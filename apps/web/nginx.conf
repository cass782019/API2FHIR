server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # Specs OpenAPI grandes (ex.: schedules_1.json ~1.8 MB) excedem o
    # default de 1 MB do nginx e retornavam 413. 50 MB cobre specs reais.
    client_max_body_size 50m;

    # Proxy para FastAPI no host (make api → porta 8000)
    # proxy_read_timeout 1800s: specs com muitos endpoints fazem 1 chamada
    # LLM por endpoint sequencialmente; 19 endpoints × ~30s já estoura 5 min.
    location ~ ^/(convert|health|fhir) {
        proxy_pass         http://host.docker.internal:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Serve arquivos estáticos; fallback para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
