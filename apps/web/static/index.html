<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FHIR-Forge — OpenAPI → FHIR</title>
  <style>
    :root {
      --blue:   #1a73e8;
      --green:  #2e7d32;
      --red:    #c62828;
      --gray:   #5f6368;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      background: #f1f3f4;
      color: #202124;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 680px;
      margin: 0 auto;
      padding: 2rem;
    }

    header { margin-bottom: 1.5rem; }
    header h1 { font-size: 1.4rem; color: var(--blue); }
    header p  { color: var(--gray); margin-top: .25rem; font-size: .9rem; }

    /* ── Drop zone ──────────────────────────────────────────── */
    .drop-zone {
      border: 2px dashed #dadce0;
      border-radius: var(--radius);
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    .drop-zone:hover         { border-color: var(--blue); }
    .drop-zone.drag-over     { border-color: var(--blue); background: #e8f0fe; }
    .drop-zone.has-file      { border-color: var(--green); }

    .drop-icon { font-size: 2.5rem; line-height: 1; margin-bottom: .75rem; }
    .drop-label { font-size: 1rem; color: #202124; margin-bottom: .4rem; }
    .drop-sub   { font-size: .85rem; color: var(--gray); }
    .drop-sub button {
      background: none; border: none; color: var(--blue);
      cursor: pointer; font-size: inherit; text-decoration: underline; padding: 0;
    }
    #file-name {
      margin-top: .75rem; font-size: .875rem;
      color: var(--green); font-weight: 600;
    }

    /* ── Options ────────────────────────────────────────────── */
    details {
      margin-top: 1.25rem;
      border: 1px solid #dadce0;
      border-radius: var(--radius);
      padding: .75rem 1rem;
    }
    summary {
      cursor: pointer; font-weight: 600; color: var(--gray);
      font-size: .9rem; list-style: none; user-select: none;
    }
    summary::before { content: "▸ "; }
    details[open] summary::before { content: "▾ "; }
    .opts-grid {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: .6rem 1rem;
      margin-top: .75rem;
      align-items: center;
    }
    .opts-grid label { font-size: .875rem; color: var(--gray); }
    .opts-grid select,
    .opts-grid input {
      padding: .4rem .6rem;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: .875rem;
      width: 100%;
    }
    .opts-grid select:focus,
    .opts-grid input:focus {
      outline: 2px solid var(--blue);
      border-color: transparent;
    }

    /* ── Convert button ─────────────────────────────────────── */
    #convert-btn {
      display: block; width: 100%; margin-top: 1.25rem;
      padding: .75rem;
      background: var(--blue); color: #fff;
      border: none; border-radius: var(--radius);
      font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    #convert-btn:hover:not(:disabled) { background: #1557b0; }
    #convert-btn:disabled { background: #bdbdbd; cursor: not-allowed; }

    /* ── Spinner ────────────────────────────────────────────── */
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e0e0e0;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 1rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ──────────────────────────────────────────────── */
    .error-box {
      background: #fce8e6; color: var(--red);
      border-radius: var(--radius); padding: 1rem;
      margin-top: 1rem; font-size: .9rem; line-height: 1.5;
    }
    .error-box strong { display: block; margin-bottom: .25rem; }

    /* ── Result ─────────────────────────────────────────────── */
    .result-card {
      background: #e8f5e9;
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-top: 1rem;
    }
    .result-card h3 { color: var(--green); margin-bottom: .75rem; font-size: 1rem; }
    dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: .35rem .75rem;
    }
    dt { font-weight: 600; color: var(--gray); font-size: .875rem; }
    dd { font-size: .875rem; word-break: break-all; }

    #download-btn {
      margin-top: 1rem; padding: .6rem 1.25rem;
      background: var(--green); color: #fff;
      border: none; border-radius: var(--radius);
      font-size: .9rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    #download-btn:hover { background: #1b5e20; }

    /* ── Utility ────────────────────────────────────────────── */
    .hidden { display: none !important; }

    /* ── Spec edit section ──────────────────────────────────── */
    .spec-edit-card {
      background: #fff8e1 !important;
      border: 1px solid #f5d142;
    }
    .spec-edit-card h3 { color: var(--gray); }
    #monaco-container {
      height: 400px;
      border: 1px solid #dadce0;
      border-radius: var(--radius);
      margin-top: .75rem;
      overflow: hidden;
    }
    .spec-edit-actions {
      display: flex;
      gap: .5rem;
      margin-top: 1rem;
    }
    .btn-secondary {
      background: var(--gray); color: #fff; border: none;
      padding: .6rem 1.25rem; border-radius: var(--radius);
      cursor: pointer; font-size: .9rem;
    }
    .btn-primary {
      background: var(--green); color: #fff; border: none;
      padding: .6rem 1.25rem; border-radius: var(--radius);
      cursor: pointer; font-weight: 600; flex: 1;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
</head>
<body>
  <main class="card">

    <header>
      <h1>FHIR-Forge</h1>
      <p>Converta especificações OpenAPI/Swagger em recursos FHIR R4 (BR Core / RNDS)</p>
    </header>

    <!-- 1. Drop zone -->
    <div id="upload-zone" class="drop-zone" role="button" tabindex="0" aria-label="Área para upload de arquivo">
      <input type="file" id="file-input" accept=".json,.yaml,.yml" hidden>
      <div class="drop-icon">📄</div>
      <p class="drop-label">Arraste seu arquivo aqui</p>
      <p class="drop-sub">ou <button id="browse-btn" type="button">clique para selecionar</button></p>
      <p id="file-name" class="hidden"></p>
    </div>

    <!-- 2. Options -->
    <details id="opts">
      <summary>Opções de conversão</summary>
      <div class="opts-grid">
        <label for="model-select">Modelo</label>
        <select id="model-select">
          <option value="claude-opus-4-7">claude-opus-4-7 (padrão)</option>
          <option value="claude-haiku-4-5-20251001">claude-haiku-4-5-20251001 (rápido)</option>
          <option value="sabia-4">sabia-4 (PT-BR)</option>
        </select>
        <label for="hapi-url">HAPI Base URL</label>
        <input type="text" id="hapi-url" value="http://localhost:8090/fhir" placeholder="http://localhost:8090/fhir">
      </div>
    </details>

    <!-- 3. Actions -->
    <button id="convert-btn" type="button" disabled>Converter para FHIR</button>
    <div id="spinner" class="spinner hidden" role="status" aria-label="Convertendo..."></div>
    <div id="error-box" class="error-box hidden" role="alert"></div>

    <!-- 3.5 Spec inferida (só aparece quando upload é payload) -->
    <section id="spec-edit-section" class="hidden">
      <div class="result-card spec-edit-card">
        <h3>📝 Spec inferida (revisar antes de converter)</h3>
        <p class="drop-sub" id="fabricated-warning"></p>
        <div id="monaco-container"></div>
        <div class="spec-edit-actions">
          <button id="cancel-edit-btn" type="button" class="btn-secondary">Cancelar</button>
          <button id="confirm-convert-btn" type="button" class="btn-primary">✓ Confirmar e converter</button>
        </div>
      </div>
    </section>

    <!-- 4. Result -->
    <section id="result-section" class="hidden">
      <div class="result-card">
        <h3>✅ Conversão concluída</h3>
        <dl id="stats"></dl>
        <button id="download-btn" type="button">⬇ Download bundle.json</button>
      </div>
    </section>

  </main>

  <script>
    'use strict';

    // ── Estado ───────────────────────────────────────────────
    let specText   = null;
    let lastBundle = null;

    // ── Elementos ────────────────────────────────────────────
    const uploadZone  = document.getElementById('upload-zone');
    const fileInput   = document.getElementById('file-input');
    const browseBtn   = document.getElementById('browse-btn');
    const fileName    = document.getElementById('file-name');
    const convertBtn  = document.getElementById('convert-btn');
    const spinner     = document.getElementById('spinner');
    const errorBox    = document.getElementById('error-box');
    const resultSect  = document.getElementById('result-section');
    const statsEl     = document.getElementById('stats');
    const downloadBtn = document.getElementById('download-btn');
    const modelSelect = document.getElementById('model-select');
    const hapiUrl     = document.getElementById('hapi-url');

    // ── Upload: drag-and-drop ─────────────────────────────────
    uploadZone.addEventListener('dragover', e => {
      e.preventDefault();
      uploadZone.classList.add('drag-over');
    });
    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('drag-over');
    });
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f) handleFile(f);
    });

    // ── Upload: clique ────────────────────────────────────────
    browseBtn.addEventListener('click', e => {
      e.stopPropagation();
      fileInput.click();
    });
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') fileInput.click();
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = e => {
        specText = e.target.result;
        convertBtn.disabled = false;
        uploadZone.classList.remove('drag-over');
        uploadZone.classList.add('has-file');
        fileName.textContent = '📄 ' + file.name;
        fileName.classList.remove('hidden');
        // Limpa resultado anterior ao trocar arquivo
        clearResult();
      };
      reader.readAsText(file);
    }

    // ── Monaco editor (lazy) ───────────────────────────────────
    let editor = null;
    let inferredSpec = null;
    if (typeof require !== 'undefined') {
      require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs' }});
    }

    // ── Conversão ─────────────────────────────────────────────
    convertBtn.addEventListener('click', doConvert);

    async function doConvert() {
      if (!specText) return;
      setLoading(true);
      clearResult();

      try {
        // 1. Detect
        const det = await fetch('/v1/detect', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: specText })
        }).then(r => r.json());

        if (det.type === 'payload') {
          // 2. Infer
          let payloadObj;
          try { payloadObj = JSON.parse(specText); }
          catch (e) { throw new Error('JSON do payload inválido: ' + e.message); }

          const inf = await fetch('/v1/infer-spec', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ payload: payloadObj, resource_name: 'resource', method: 'POST' })
          }).then(r => r.json());

          inferredSpec = inf.spec;
          setLoading(false);
          _showSpecEditor(inf);
          return;  // espera click "Confirmar"
        }

        // Spec real — converte direto
        await _runConvert(specText);
      } catch (e) {
        showError(e.message);
        setLoading(false);
      }
    }

    function _showSpecEditor(inferenceResult) {
      document.getElementById('fabricated-warning').textContent =
        '⚠ Campos fabricados (revisar): ' + inferenceResult.fabricated.join(', ');
      document.getElementById('spec-edit-section').classList.remove('hidden');
      require(['vs/editor/editor.main'], function() {
        if (editor) editor.dispose();
        editor = monaco.editor.create(document.getElementById('monaco-container'), {
          value: JSON.stringify(inferenceResult.spec, null, 2),
          language: 'json',
          automaticLayout: true,
          minimap: { enabled: false },
        });
      });
    }

    document.getElementById('confirm-convert-btn').addEventListener('click', async () => {
      const editedText = editor.getValue();
      let editedSpec;
      try { editedSpec = JSON.parse(editedText); }
      catch (e) { showError('JSON inválido: ' + e.message); return; }

      setLoading(true);
      document.getElementById('spec-edit-section').classList.add('hidden');

      try {
        // 3. Validate
        const val = await fetch('/v1/validate-spec', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ spec: editedSpec })
        }).then(r => r.json());

        if (!val.valid) {
          showError('Spec inválido: ' + val.errors.join('; '));
          document.getElementById('spec-edit-section').classList.remove('hidden');
          setLoading(false);
          return;
        }

        // 4. Convert
        await _runConvert(JSON.stringify(editedSpec));
      } catch (e) {
        showError(e.message);
        setLoading(false);
      }
    });

    document.getElementById('cancel-edit-btn').addEventListener('click', () => {
      document.getElementById('spec-edit-section').classList.add('hidden');
      if (editor) { editor.dispose(); editor = null; }
      inferredSpec = null;
    });

    async function _runConvert(spec) {
      const res = await fetch('/v1/convert', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          spec,
          options: {
            async: false,
            model: modelSelect.value,
            hapi_base_url: hapiUrl.value.trim()
          }
        })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail ?? 'HTTP ' + res.status);
      }
      showResult(await res.json());
      setLoading(false);
    }

    // ── Resultado ─────────────────────────────────────────────
    function showResult(data) {
      lastBundle = data.bundle;
      const entries   = (lastBundle.entry ?? []);
      const count     = entries.length;
      const types     = [...new Set(entries.map(e => e.resource?.resourceType).filter(Boolean))].join(', ') || '—';
      const bundleType = lastBundle.type ?? '—';

      statsEl.innerHTML =
        '<dt>Job ID</dt><dd>' + escHtml(data.job_id) + '</dd>' +
        '<dt>Status</dt><dd>' + escHtml(data.status) + '</dd>' +
        '<dt>Entradas</dt><dd>' + count + '</dd>' +
        '<dt>Tipos</dt><dd>' + escHtml(types) + '</dd>' +
        '<dt>Bundle type</dt><dd>' + escHtml(bundleType) + '</dd>';

      resultSect.classList.remove('hidden');
    }

    function clearResult() {
      resultSect.classList.add('hidden');
      errorBox.classList.add('hidden');
      errorBox.innerHTML = '';
      statsEl.innerHTML  = '';
      lastBundle = null;
    }

    function showError(msg) {
      errorBox.innerHTML = '<strong>Erro na conversão</strong>' + escHtml(msg);
      errorBox.classList.remove('hidden');
    }

    // ── Download client-side ──────────────────────────────────
    downloadBtn.addEventListener('click', () => {
      if (!lastBundle) return;
      const blob = new Blob([JSON.stringify(lastBundle, null, 2)], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = Object.assign(document.createElement('a'), {
        href: url, download: 'fhir-bundle.json'
      });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // ── Helpers ───────────────────────────────────────────────
    function setLoading(on) {
      convertBtn.disabled = on;
      spinner.classList.toggle('hidden', !on);
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
