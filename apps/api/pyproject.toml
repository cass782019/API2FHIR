[project]
name = "fhir-forge-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "redis>=5.2",
    "anthropic>=0.50",
    "structlog>=24.4",
    "ulid-py>=1.1",
    "PyYAML>=6.0",
    "psycopg[binary,pool]>=3.2",
    "fhir-forge-core",
    "fhir-forge-fhir-forge",
    "fhir-forge-connectors",
    "fhir-forge-spec-inferer",
    "fhir-forge-mcp-server",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
fhir-forge-core = { workspace = true }
fhir-forge-fhir-forge = { workspace = true }
fhir-forge-connectors = { workspace = true }
fhir-forge-spec-inferer = { workspace = true }
fhir-forge-mcp-server = { workspace = true }
