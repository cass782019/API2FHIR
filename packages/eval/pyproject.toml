[project]
name = "fhir-forge-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepdiff>=8.0",
    "rich>=13.9",
    "fhir-forge-core",
    "fhir-forge-fhir-forge",
    "fhir-forge-swagger-lens",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval"]

[tool.uv.sources]
fhir-forge-core = { workspace = true }
fhir-forge-fhir-forge = { workspace = true }
fhir-forge-swagger-lens = { workspace = true }
