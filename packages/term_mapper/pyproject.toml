[project]
name = "fhir-forge-term-mapper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2",
    "httpx>=0.28",
    "fhir-forge-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/term_mapper"]

[tool.uv.sources]
fhir-forge-core = { workspace = true }
