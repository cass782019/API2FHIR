[project]
name = "fhir-forge-fhir-forge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=3.0",
    "anthropic>=0.50",
    "fhir.resources>=7.1.0",
    "httpx>=0.28",
    "fhir-forge-core",
    "fhir-forge-swagger-lens",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fhir_forge"]

[tool.uv.sources]
fhir-forge-core = { workspace = true }
fhir-forge-swagger-lens = { workspace = true }
