[project]
name = "fhir-forge-connectors"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "tenacity>=9.0",
    "pybreaker>=1.2",
    "fhir-forge-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectors"]

[tool.uv.sources]
fhir-forge-core = { workspace = true }
