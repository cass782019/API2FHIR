[project]
name = "fhir-forge-swagger-lens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openapi-spec-validator>=0.7",
    "openapi-pydantic>=0.5",
    "PyYAML>=6.0",
    "fhir-forge-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swagger_lens"]

[tool.uv.sources]
fhir-forge-core = { workspace = true }
