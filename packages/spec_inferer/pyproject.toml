[project]
name = "fhir-forge-spec-inferer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "genson>=1.3",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_inferer"]
